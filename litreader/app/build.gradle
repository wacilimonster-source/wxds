plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// 版本号由 tag / CI 注入；本地构建取“最近 v* tag 与 0.29 中较大者”，
// 避免仓库里遗留的 v0.1 tag 或版本回退导致 versionCode 低于已安装版本。
def parseVersionCode = { String name ->
    try {
        def parts = name.tokenize('.')
        (parts.size() > 0 ? parts[0].toInteger() : 0) * 10000 +
        (parts.size() > 1 ? parts[1].toInteger() : 0) * 100 +
        (parts.size() > 2 ? parts[2].toInteger() : 0)
    } catch (ignored) {
        -1
    }
}
def gitVersionName = null
try {
    def proc = ['git', 'describe', '--tags', '--abbrev=0', '--match', 'v[0-9]*']
            .execute(null, rootDir)
    if (proc.waitFor() == 0) {
        gitVersionName = proc.text.trim().replaceFirst(/^v/, '')
    }
} catch (ignored) {
}
def defaultVersionName = '0.29'
if (gitVersionName && parseVersionCode(gitVersionName) > parseVersionCode(defaultVersionName)) {
    defaultVersionName = gitVersionName
}
def appVersionName = (findProperty('versionName') ?: defaultVersionName).toString()
def appVersionCode = (findProperty('versionCode') ?: parseVersionCode(appVersionName)).toString().toInteger()

def keystoreFile = System.getenv('LITREADER_KEYSTORE_FILE')

android {
    namespace 'com.example.litreader'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.litreader"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('LITREADER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LITREADER_KEY_ALIAS')
                keyPassword System.getenv('LITREADER_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
